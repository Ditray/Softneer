<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#101e2c">
  <meta name="description" content="Softneer — инженерные расчёты, справочник и каталог STEP.">
  <title>Softneer — инженерная среда</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="src/engine.js"></script>
  <script defer src="src/cad.js"></script>
  <script defer src="src/content.js"></script>
  <script defer src="src/draw.js"></script>
  <script defer src="src/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">К содержимому</a>
  <aside class="sidebar" id="sidebar" aria-label="Разделы приложения">
    <a class="brand" href="#gear" aria-label="Softneer, к расчёту передачи">
      <span class="brand-symbol" data-icon="gear"></span>
      <span><strong>Softneer<span class="brand-period">.</span></strong><small>ИНЖЕНЕРНАЯ СРЕДА</small></span>
    </a>
    <nav id="navigation"></nav>
    <div class="sidebar-footer"><span class="status-dot"></span> Локальная версия <span class="version">0.1</span></div>
  </aside>
  <header class="topbar">
    <button class="icon-button mobile-menu" id="menu-toggle" type="button" aria-label="Меню" aria-expanded="false" aria-controls="sidebar" data-icon="menu"></button>
    <div id="breadcrumb" class="breadcrumb"></div>
    <button class="search-button" id="global-search" type="button"><span data-icon="search"></span><span>Поиск по разделам</span><kbd>⌘ K</kbd></button>
  </header>
  <main id="main" class="main" tabindex="-1"></main>
  <dialog id="search-dialog" class="dialog" aria-labelledby="search-title">
    <div class="dialog-top">
      <label id="search-title" for="search-input">Поиск в Softneer</label>
      <button class="icon-button" id="search-close" type="button" data-icon="close" aria-label="Закрыть"></button>
    </div>
    <input id="search-input" placeholder="Например, деформация или ISO 281" autocomplete="off">
    <div id="search-results" class="search-results"></div>
  </dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <noscript>Для расчётов включите JavaScript в браузере.</noscript>
</body>
</html>
